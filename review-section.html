    <!-- レビュー（data-recipe-id はレシピごとに変える） -->
    <section class="review-section" id="review-section" data-recipe-id="tamago-yaki-udon" aria-label="レビュー">
      <h2>みんなのレビュー ⭐</h2>
      <div class="review-summary">
        <div class="review-stars" id="average-stars">☆☆☆☆☆</div>
        <p><strong id="review-average">まだ評価はありません</strong></p>
        <p id="review-count">レビュー 0件</p>
      </div>

      <!-- ログインしているときだけ表示 -->
      <form id="review-form" class="review-form" hidden>
        <h3>レビューを投稿する</h3>
        <label for="review-name">お名前</label>
        <input id="review-name" maxlength="30" required placeholder="ニックネーム">

        <label for="review-rating">星の数</label>
        <select id="review-rating" required>
          <option value="5">★★★★★（5）</option>
          <option value="4">★★★★☆（4）</option>
          <option value="3">★★★☆☆（3）</option>
          <option value="2">★★☆☆☆（2）</option>
          <option value="1">★☆☆☆☆（1）</option>
        </select>

        <label for="review-comment">コメント</label>
        <textarea id="review-comment" rows="4" maxlength="1000" required placeholder="作ってみた感想を教えてね！"></textarea>

        <label for="review-photo">写真（なくてもOK）</label>
        <input type="file" id="review-photo" accept="image/jpeg,image/png,image/webp,image/gif">

        <button id="review-submit" type="submit">レビューを投稿する</button>
      </form>

      <!-- ログインしていないときだけ表示 -->
      <p id="review-login-note" class="rv-note">
        <a href="auth.html">ログイン</a>すると、レビューと写真を投稿できます。
      </p>

      <p id="review-message" role="status" aria-live="polite" hidden></p>

      <div class="review-list">
        <h3>投稿されたレビュー</h3>
        <div id="review-items">
          <p>読み込み中...</p>
        </div>
      </div>
    </section>
